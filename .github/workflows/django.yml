name: Django CI

on:
  push:
    branches: [main]
    paths:
      - 'DjangoBookStore/'
      - '.github/workflows/django.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DjangoBookStore/'
      - '.github/workflows/django.yml'

concurrency:
  group: {{ github.workflow }}-{{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: DjangoBookStore
env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint (flake8, black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: DjangoBookStore/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: flake8
        run: flake8 .

      - name: black (check only)
        run: black --check .
  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-do-not-use-anywhere-else-1234567890
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: DjangoBookStore/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile translations
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python manage.py compilemessages

      - name: pytest with coverage
        run: pytest --cov-report=xml --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: DjangoBookStore/coverage.xml
          fail_ci_if_error: false
  docker:
    name: Build and push Docker image
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: DjangoBookStore
          push: true
          tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/djangobookstore:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/djangobookstore{{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max