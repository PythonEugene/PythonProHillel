name: Platform CI

on:
  push:
    branches: [main]
    paths:
      - ‘BookStorePlatform/**’
      - ‘.github/workflows/platform.yml’
  pull_request:
    branches: [main]
    paths:
      - ‘BookStorePlatform/**’
      - ‘.github/workflows/platform.yml’

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: ‘3.12’

jobs:
  lint:
    name: Lint (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [project_a, project_b]
    defaults:
      run:
        working-directory: BookStorePlatform/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: BookStorePlatform/${{ matrix.project }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: flake8 .
      - run: black —check .

  test:
    name: Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [project_a, project_b]
    defaults:
      run:
        working-directory: BookStorePlatform/${{ matrix.project }}
    env:
      SECRET_KEY: ci-only-secret-key-do-not-use-anywhere-else-1234567890
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: BookStorePlatform/${{ matrix.project }}/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile translations
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          if [ -d locale ]; then python manage.py compilemessages; fi
      - name: pytest with coverage
        run: pytest —cov-report=xml —cov-fail-under=90

  docker:
    name: Build and push (${{ matrix.image }})
    needs: [lint, test]
    if: github.event_name == ‘push’ && github.ref == ‘refs/heads/main’
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {context: BookStorePlatform/project_a, image: bookstore-a}
          - {context: BookStorePlatform/project_b, image: warehouse-b}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}