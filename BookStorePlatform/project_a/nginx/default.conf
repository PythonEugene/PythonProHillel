upstream project_a_backend { server project_a:8000; }
upstream project_b_backend { server project_b:8001; }
server { listen 80; client_max_body_size 10M;
location /static/ {
    alias /app/staticfiles/;
    expires 30d;
    access_log off;
}

location /api/v1/reservations/ {
    proxy_pass http://project_b_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://project_a_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
}