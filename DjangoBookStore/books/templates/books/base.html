{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Книжковий магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'books:list' %}">
                <img src="{% static 'images/logo.png' %}" alt="Logo" width="30" height="30" class="me-2">
                Книжковий магазин
            </a>
            <div class ="navbar-nav">
                <a class="nav-link" href="{% url 'books:list' %}">Книги</a>
                <a class="nav-link" href="{% url 'books:add' %}">Додати книгу</a>
                <a class="nav-link" href="{% url 'orders:cart_detail' %}">
                    Кошик
                    <span class="badge bg-secondary">{{ cart|default:0 }}</span>
                </a>
                {% if user.is_authenticated %}
                <span class="nav-link">{{ user.email }}</span>
                <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link nav-link">Вийти</button>
                </form>
                {% else %}
                <a class="nav-link" href="{% url 'users:login' %}">Увійти</a>
                <a class="nav-link" href="{% url 'users:register' %}">Реєстрація</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
