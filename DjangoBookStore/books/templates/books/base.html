{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Книжковий магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'books:list' %}">
                <img src="{% static 'images/logo.png' %}" alt="Logo" width="30" height="30" class="me-2">
                Книжковий магазин
            </a>
            <div class ="navbar-nav">
                <a class="nav-link" href="{% url 'books:list' %}">Бiблiотека</a>
                <a class="nav-link" href="{% url 'books:add' %}">Додати книгу</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
